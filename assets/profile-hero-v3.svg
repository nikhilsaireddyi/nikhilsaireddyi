<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Nikhil Sai Reddy — Neural Systems. An original futuristic AI engineering introduction.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070910"/><stop offset=".56" stop-color="#0c1220"/><stop offset="1" stop-color="#17102b"/></linearGradient>
<linearGradient id="neon" x1="0" x2="1"><stop stop-color="#70faff"/><stop offset=".58" stop-color="#a78bfa"/><stop offset="1" stop-color="#b5fc6c"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#23dcec" stop-opacity=".27"/><stop offset="1" stop-color="#23dcec" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#66d9e8" stroke-opacity=".08"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clip"><rect x="0" y="0" width="1200" height="400" rx="18"/></clipPath></defs>
<g clip-path="url(#clip)"><rect width="1200" height="400" fill="url(#bg)"/><rect width="1200" height="400" fill="url(#grid)"/>
<circle cx="965" cy="198" r="215" fill="url(#aura)"/>
<g fill="none" stroke="#6cecf8" stroke-width="1"><circle cx="956" cy="202" r="128" opacity=".5"/><circle cx="956" cy="202" r="92" opacity=".38"/><circle cx="956" cy="202" r="53" opacity=".5"/><path d="M956 55v293M808 202h296" stroke-opacity=".23"/>
<g style="transform-origin:956px 202px;animation:orbit 20s linear infinite"><ellipse cx="956" cy="202" rx="164" ry="69" transform="rotate(-30 956 202)" stroke="#a78bfa" stroke-opacity=".78" stroke-width="2"/><circle cx="1098" cy="120" r="5" fill="#bbf7d0" stroke="none"/></g>
<g style="transform-origin:956px 202px;animation:orbitReverse 25s linear infinite"><ellipse cx="956" cy="202" rx="145" ry="83" transform="rotate(37 956 202)" stroke="#50e8fa" stroke-opacity=".4"/></g></g>
<g stroke="#5eead4" stroke-width="2" fill="none" opacity=".7"><path d="M28 70V28h85M1087 28h85v42M28 331v41h85M1087 372h85v-41"/></g>
<path d="M35 93h510" stroke="#50e8fa" stroke-opacity=".18"/>
<text x="56" y="65" fill="#89f6f7" font-family="monospace" font-size="16" letter-spacing="3">NIKHIL / PERSONAL TERMINAL</text>
<text x="56" y="151" fill="#f4f6ff" font-family="sans-serif" font-weight="800" font-size="76" letter-spacing="-2">NIKHIL SAI</text>
<text x="56" y="231" fill="url(#neon)" font-family="sans-serif" font-weight="900" font-size="83" letter-spacing="-3">REDDY<tspan fill="#b5fc6c">_</tspan></text>
<text x="60" y="277" fill="#e3e8f4" font-family="monospace" font-size="18" letter-spacing="2">AI / ML  ·  FRONTEND  ·  CREATIVE CODE</text>
<path d="M58 303h488" stroke="url(#neon)" stroke-width="2"/>
<text x="59" y="343" fill="#a9b8d4" font-family="monospace" font-size="15" letter-spacing="2">BUILD WHAT DOESN'T EXIST YET.</text>
<rect x="846" y="172" width="220" height="60" rx="10" fill="#0a1220" stroke="#48ddeb" stroke-opacity=".7"/>
<text x="865" y="198" fill="#75f5ec" font-family="monospace" font-size="14">SYSTEM.STATUS</text><text x="865" y="217" fill="#b5fc6c" font-family="monospace" font-weight="bold" font-size="13">● EXPLORING / BUILDING</text>
<g style="animation:pulse 2.6s ease-in-out infinite"><circle cx="1134" cy="345" r="5" fill="#b5fc6c" filter="url(#glow)"/></g>
<g style="animation:scan 9s linear infinite"><rect x="-120" width="120" height="400" fill="#7dd3fc" opacity=".045"/></g>
</g>
<style>@keyframes orbit{to{transform:rotate(360deg)}}@keyframes orbitReverse{to{transform:rotate(-360deg)}}@keyframes pulse{50%{opacity:.3}}@keyframes scan{to{transform:translateX(1440px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
</svg>