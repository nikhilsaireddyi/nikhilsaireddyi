<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Nikhil Sai Reddy, frontend developer and AI/ML student. A cinematic midnight and champagne gold profile header.">
<defs>
 <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080D1A"/><stop offset=".55" stop-color="#12192B"/><stop offset="1" stop-color="#1D1B2F"/></linearGradient>
 <radialGradient id="halo"><stop offset="0" stop-color="#E8BB70" stop-opacity=".27"/><stop offset=".48" stop-color="#B78E61" stop-opacity=".12"/><stop offset="1" stop-color="#E8BB70" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#AF8554"/><stop offset=".45" stop-color="#F7DBA8"/><stop offset=".68" stop-color="#E8BB70"/><stop offset="1" stop-color="#B58B56"/></linearGradient>
 <linearGradient id="goldStroke"><stop stop-color="#7F6142"/><stop offset=".5" stop-color="#F3D8A5"/><stop offset="1" stop-color="#8F6D48"/></linearGradient>
 <linearGradient id="shine" x1="0" x2="1"><stop stop-color="#F9E9CF" stop-opacity="0"/><stop offset=".5" stop-color="#FFF6E8" stop-opacity=".44"/><stop offset="1" stop-color="#F9E9CF" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#A89686" stroke-opacity=".075"/></pattern>
 <filter id="subtleGlow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="viewport"><rect width="1200" height="480" rx="20"/></clipPath>
</defs>
<g clip-path="url(#viewport)">
<rect width="1200" height="480" fill="url(#night)"/>
<rect width="1200" height="480" fill="url(#grid)"/>
<circle cx="961" cy="237" r="262" fill="url(#halo)"><animate attributeName="opacity" values=".68;1;.68" dur="8s" repeatCount="indefinite"/></circle>
<path d="M0 0H1200V480H0Z" fill="none" stroke="#9C7C56" stroke-opacity=".35" stroke-width="2"/>
<path d="M39 74H1160M39 407H1160" stroke="#D0B489" stroke-opacity=".22"/>
<path d="M762 95V382" stroke="#D0B489" stroke-opacity=".24"/>

<!-- Fine gold scan traces moving behind content. -->
<g fill="none" stroke="#E8BB70" stroke-opacity=".15" stroke-width="1.3">
 <path d="M780 135H1160"><animate attributeName="stroke-dasharray" values="0 380;110 270;0 380" dur="11s" repeatCount="indefinite"/></path>
 <path d="M780 375H1150" stroke-dasharray="5 10"/>
</g>
<circle cx="801" cy="131" r="2.1" fill="#E8BB70" opacity=".45"><animate attributeName="opacity" values=".15;.65;.15" dur="5s" begin="-0s" repeatCount="indefinite"/></circle>
<circle cx="1086" cy="91" r="1.8" fill="#DFD4C7" opacity=".45"><animate attributeName="opacity" values=".15;.65;.15" dur="8s" begin="-0.6s" repeatCount="indefinite"/></circle>
<circle cx="1157" cy="204" r="1.6" fill="#DFD4C7" opacity=".45"><animate attributeName="opacity" values=".15;.65;.15" dur="9s" begin="-1.2s" repeatCount="indefinite"/></circle>
<circle cx="775" cy="339" r="1.9" fill="#E8BB70" opacity=".45"><animate attributeName="opacity" values=".15;.65;.15" dur="11s" begin="-1.7999999999999998s" repeatCount="indefinite"/></circle>
<circle cx="1083" cy="362" r="2.3" fill="#DFD4C7" opacity=".45"><animate attributeName="opacity" values=".15;.65;.15" dur="7s" begin="-2.4s" repeatCount="indefinite"/></circle>
<circle cx="932" cy="67" r="1.6" fill="#DFD4C7" opacity=".45"><animate attributeName="opacity" values=".15;.65;.15" dur="13s" begin="-3s" repeatCount="indefinite"/></circle>
<circle cx="1166" cy="337" r="1.5" fill="#E8BB70" opacity=".45"><animate attributeName="opacity" values=".15;.65;.15" dur="8s" begin="-3.5999999999999996s" repeatCount="indefinite"/></circle>
<circle cx="873" cy="430" r="1.8" fill="#DFD4C7" opacity=".45"><animate attributeName="opacity" values=".15;.65;.15" dur="12s" begin="-4.2s" repeatCount="indefinite"/></circle>
<circle cx="1108" cy="421" r="1.6" fill="#DFD4C7" opacity=".45"><animate attributeName="opacity" values=".15;.65;.15" dur="9s" begin="-4.8s" repeatCount="indefinite"/></circle>
<circle cx="786" cy="244" r="1.2" fill="#E8BB70" opacity=".45"><animate attributeName="opacity" values=".15;.65;.15" dur="10s" begin="-5.3999999999999995s" repeatCount="indefinite"/></circle>
<circle cx="1033" cy="116" r="1.4" fill="#DFD4C7" opacity=".45"><animate attributeName="opacity" values=".15;.65;.15" dur="12s" begin="-6s" repeatCount="indefinite"/></circle>
<circle cx="1057" cy="273" r="1.5" fill="#DFD4C7" opacity=".45"><animate attributeName="opacity" values=".15;.65;.15" dur="9s" begin="-6.6s" repeatCount="indefinite"/></circle>

<!-- Left: always-readable typography, never hidden behind an animation. -->
<g font-family="Arial,Helvetica,sans-serif">
 <text x="42" y="47" fill="#E8BB70" font-size="14" letter-spacing="3" font-weight="700">NIKHIL / ORIGINAL WORK</text>
 <text x="1160" y="47" text-anchor="end" fill="#CABAA6" font-family="monospace" font-size="13" letter-spacing="2">SELECTED PORTFOLIO • 2026</text>
 <text x="43" y="132" fill="#E8BB70" font-family="monospace" font-size="17" letter-spacing="4">HELLO, I'M</text>
 <text x="35" y="239" fill="#F8E8CF" font-size="113" font-weight="900" letter-spacing="-5">NIKHIL</text>
 <text x="35" y="345" fill="url(#gold)" font-size="105" font-weight="900" letter-spacing="-5">SAI REDDY<tspan fill="#F8E8CF">.</tspan></text>
 <rect x="43" y="362" width="282" height="29" rx="4" fill="#E8BB70"/>
 <text x="58" y="382" fill="#111625" font-family="monospace" font-size="14" font-weight="700" letter-spacing="1">FRONTEND DEVELOPER</text>
 <text x="345" y="382" fill="#F4E4D1" font-family="monospace" font-size="14" letter-spacing="1">/ AI &amp; ML STUDENT</text>
 <text x="43" y="447" fill="#BEB1A6" font-family="monospace" font-size="13" letter-spacing="2">VISAKHAPATNAM, INDIA</text>
 <text x="1154" y="447" text-anchor="end" fill="#BEB1A6" font-family="monospace" font-size="13" letter-spacing="2">EXPERIMENT · BUILD · REFINE</text>
</g>

<!-- Right: layered orbital data sculpture. -->
<g transform="translate(969 235)">
 <circle r="154" fill="none" stroke="#E8BB70" stroke-opacity=".17" stroke-width="1.5" stroke-dasharray="5 12"/>
 <circle r="135" fill="none" stroke="#F0D9B2" stroke-opacity=".14" stroke-width="1.5"/>
 <g>
  <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="31s" repeatCount="indefinite"/>
  <circle r="113" fill="none" stroke="url(#goldStroke)" stroke-width="2" stroke-opacity=".8" stroke-dasharray="170 535"/>
  <circle cx="0" cy="-113" r="6" fill="#F8DBA4" filter="url(#subtleGlow)"/>
  <circle cx="0" cy="-113" r="14" fill="none" stroke="#E8BB70" stroke-opacity=".4"><animate attributeName="r" values="8;19;8" dur="3.1s" repeatCount="indefinite"/></circle>
 </g>
 <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
  <ellipse rx="121" ry="59" transform="rotate(39)" fill="none" stroke="#E8BB70" stroke-opacity=".55" stroke-width="1.7"/>
  <circle cx="121" cy="0" r="5" fill="#F1D7AC"/>
 </g>
 <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="39s" repeatCount="indefinite"/>
  <ellipse rx="121" ry="59" transform="rotate(-43)" fill="none" stroke="#C9AA84" stroke-opacity=".5" stroke-width="1.6"/>
 </g>
 <g fill="none" stroke="#D0AA79" stroke-opacity=".56">
  <path d="M-80 -42L-2 -75 83 -28 71 67 -27 89 -80 -42M-2 -75L71 67M83 -28L-27 89" stroke-width="1.7"/>
 </g>
 <g fill="#E8BB70"><circle cx="-80" cy="-42" r="5"/><circle cx="-2" cy="-75" r="6"/><circle cx="83" cy="-28" r="5"/></g>
 <g fill="#F6E1BC"><circle cx="71" cy="67" r="6"/><circle cx="-27" cy="89" r="5"/></g>
 <circle r="5" fill="#FFF3DD" filter="url(#subtleGlow)">
  <animateMotion path="M-80,-42 L-2,-75 L83,-28 L71,67 L-27,89 L-80,-42" dur="9s" repeatCount="indefinite"/>
 </circle>
 <circle r="37" fill="#E8BB70" fill-opacity=".085" stroke="#E8BB70" stroke-opacity=".35"/>
 <circle r="11" fill="#F3D9A9" fill-opacity=".85"><animate attributeName="r" values="8;13;8" dur="5s" repeatCount="indefinite"/></circle>
 <text x="0" y="171" text-anchor="middle" fill="#CDB9A0" font-family="monospace" font-size="13" letter-spacing="3">NEURAL / SYSTEMS</text>
</g>

<!-- Cinematic glint across the lower trim; all content stays visible when static. -->
<rect x="-220" y="405" width="220" height="2" fill="url(#shine)">
 <animate attributeName="x" values="-220;1280" dur="14s" repeatCount="indefinite"/>
</rect>
<g stroke="#D7BD95" stroke-width="2" fill="none">
 <path d="M24 24h50m-50 0v50M1176 24h-50m50 0v50M24 456h50m-50 0v-25m1152 25h-50m50 0v-25" stroke-opacity=".48"/>
</g>
</g>
<style>@media(prefers-reduced-motion:reduce){animate,animateMotion,animateTransform{display:none!important}}</style>
</svg>